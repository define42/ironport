name: Lint

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pin to a known-good major version of golangci-lint so the lint
          # rules don't silently change underneath us. The default linter
          # set (errcheck, gosimple, govet, ineffassign, staticcheck, unused)
          # is sufficient for this codebase.
          version: v1.64.8
          args: --timeout=5m
